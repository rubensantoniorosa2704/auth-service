services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  migrate:
    image: migrate/migrate:latest
    container_name: auth-migrate
    volumes:
      - ./database/migrations:/migrations
    command: >
      -path=/migrations
      -database postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-auth}?sslmode=disable
      up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network
    restart: on-failure

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-server
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${GRPC_PORT:-50051}
    ports:
      - "${GRPC_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - auth-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  auth-network:
    driver: bridge
