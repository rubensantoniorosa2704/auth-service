syntax = "proto3";

package auth.v1;

option go_package = "github.com/rubensantoniorosa2704/auth-service/proto/auth/v1;authv1";

// =====================
// Auth Service Contract
// =====================

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

// =====================
// Register
// =====================

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
}

// =====================
// Login
// =====================

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
}
